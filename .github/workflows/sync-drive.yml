name: Sync Drive links

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keepalive (расписание не отключится через 60 дней)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync-drive.yml/enable || true
      - name: Sync links from Drive
        env:
          DRIVE_INDEX_URL: ${{ secrets.DRIVE_INDEX_URL }}
          DRIVE_INDEX_KEY: ${{ secrets.DRIVE_INDEX_KEY }}
        run: python _src/sync.py
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto: links updated from Drive"
            git pull --rebase || { git rebase --abort; exit 1; }
            git push
            gh api -X POST repos/${{ github.repository }}/pages/builds
          fi
